"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Session schedule slot
description: "A component to display a session schedule slot with time slots and talks."
status: stable
# Retrocompatibilidad (2026-09-28): la config usa 'drupalcamp:session_schedule_slot' y core
# (ComponentNegotiator) resuelve este componente cuando ddd2027 es el tema
# activo; con drupalcamp activo se pinta el original. Ver
# dev_utils/redesign-ddd2027/07-retrocompatibilidad-drupalcamp-theme.md.
replaces: 'drupalcamp:session_schedule_slot'
dependencies:
  - core/drupal
  - core/jquery
slots:
  items:
    title: Items
props:
  type: object
  properties:
    title:
      type: string
      title: Time Slot Title
      description: "The title of the time slot group"
    options:
      type: object
      title: Grid Options
      description: "Grid display options"
      properties:
        alignment:
          type: string
          title: Alignment
          description: "Grid alignment (horizontal or vertical)"
          default: horizontal
          enum: [horizontal, vertical]
        columns:
          type: integer
          title: Columns
          description: "Number of columns in the grid"
          default: 2
          minimum: 1
          maximum: 4
        cell_min_width:
          type: integer
          title: Minimum Cell Width
          description: "Minimum width of grid cells in pixels"
          default: 300
          minimum: 100
        grid_gutter:
          type: integer
          title: Grid Gutter
          description: "Space between grid cells in pixels"
          default: 20
          minimum: 0
