'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Speaker
status: stable
# Retrocompatibilidad (2026-09-28): la config usa 'drupalcamp:speaker' y core
# (ComponentNegotiator) resuelve este componente cuando ddd2027 es el tema
# activo; con drupalcamp activo se pinta el original. Ver
# dev_utils/redesign-ddd2027/07-retrocompatibilidad-drupalcamp-theme.md.
replaces: 'drupalcamp:speaker'
variants:
  vertical:
    title: Vertical
  horizontal:
    title: Horizontal
props:
  type: object
  properties:
    name:
      type: string
      title: Name
    link:
      "$ref": ui-patterns://url
      title: Link
slots:
  image:
    title: Image
  text:
    title: Text
