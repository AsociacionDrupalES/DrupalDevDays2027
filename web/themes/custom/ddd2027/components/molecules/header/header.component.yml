$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Header
description: "Main site header that includes logo, menu, language switcher, and buttons."
status: stable
# Retrocompatibilidad (2026-09-28): la config usa 'drupalcamp:header' y core
# (ComponentNegotiator) resuelve este componente cuando ddd2027 es el tema
# activo; con drupalcamp activo se pinta el original. Ver
# dev_utils/redesign-ddd2027/07-retrocompatibilidad-drupalcamp-theme.md.
replaces: 'drupalcamp:header'
props:
  type: object
  properties:
    logo:
      type: array
      title: "Logo"
      description: "Slot for the site logo component."
    content:
      type: array
      title: "Main Menu"
      description: "Slot for the main navigation menu, language switcher and other blocks."
