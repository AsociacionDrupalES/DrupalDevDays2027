'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Card
status: stable
# Retrocompatibilidad (2026-09-28): la config usa 'drupalcamp:card' y core
# (ComponentNegotiator) resuelve este componente cuando ddd2027 es el tema
# activo; con drupalcamp activo se pinta el original. Ver
# dev_utils/redesign-ddd2027/07-retrocompatibilidad-drupalcamp-theme.md.
replaces: 'drupalcamp:card'
variants:
  default:
    title: Default
  featured:
    title: Featured
  with-border:
    title: Card with border
props:
  type: object
  properties:
    css_classes:
      type: string
      title: CSS classes
    title:
      type: string
      title: Title
slots:
  text:
    title: Text
