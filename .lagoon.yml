docker-compose-yaml: docker-compose.yml

project: drupal-dev-days-2027

environment_variables:
  git_sha: 'true'

tasks:
  post-rollout:
    - run:
        name: drush deploy
        command: drush -y deploy
        service: cli
        shell: bash

routes:
  insecure: Redirect

_route: &ROUTE
 tls-acme: 'true'
 insecure: Redirect
 hsts: max-age=31536000;includeSubDomains;preload

environments:
  main:
    routes:
      - nginx:
          - valencia2027.drupaldays.org:  *ROUTE

    cronjobs:
      - name: drush cron
        schedule: "H * * * *" # This will run the cron once per hour.
        command: drush cron
        service: cli
  develop:
    routes:
      - nginx:
          - nginx.develop.drupal-dev-days-2027.de3.amazee.io: *ROUTE

    cronjobs:
      - name: drush cron
        schedule: "H * * * *" # This will run the cron once per hour.
        command: drush cron
        service: cli
